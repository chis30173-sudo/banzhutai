}

/* ---- 评语生成 ---- */
function renderComments(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const st = S.state.settings;
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><span style="font-weight:700">期末评语生成</span>
    <button class="btn sm primary" id="cmGen">⚡ 一键生成全班评语</button>
    <button class="btn sm" id="cmCopy">📋 全部复制</button></div></div>`;
  html += `<div class="muted small" style="margin-bottom:12px">根据积分、出勤、成绩、点评自动生成评语初稿，你再一条条改。${st.ai.enabled ? "<span class='tag green'>AI 已开启，生成更走心</span>" : "<span class='tag orange'>未配置 AI，使用模板生成</span>"}</div>`;
  html += `<div id="cmResult">` + cls.students.map(s => {
    const c = (s.comments || []).find(x => x.type === "评语");
    return `<div class="plan-row">
      <div class="info"><b>${UI.nameOf(s)}</b>${c ? `<div class="small muted" style="white-space:pre-wrap">${S.escapeHtml(c.text)}</div>` : `<div class="muted small">未生成</div>`}</div>
      <button class="btn sm" data-cme="${s.id}">编辑</button></div>`;
  }).join("") + `</div>`;
  body.innerHTML = html;
  el("cmGen").onclick = () => generateComments(cls);
  el("cmCopy").onclick = () => {
    const rows = [];
    cls.students.forEach(s => {
      const c = (s.comments || []).find(x => x.type === "评语");
      if (c) rows.push(`${s.name}：${c.text}`);
    });
    const t = rows.join("\n");
    navigator.clipboard && navigator.clipboard.writeText(t).then(() => UI.toast("已复制"))
      .catch(() => prompt("复制以下内容", t));
  };
  body.querySelectorAll("[data-cme]").forEach(b => b.onclick = () => {
    const s = cls.students.find(x => x.id === b.dataset.cme);
    UI.form(`编辑 ${UI.nameOf(s)} 评语`, [
      { key: "text", label: "评语", type: "textarea", required: true, value: (s.comments || []).find(x => x.type === "评语")?.text || "" },
    ], d => {
      if (!s.comments) s.comments = [];
      s.comments = s.comments.filter(x => x.type !== "评语");
      s.comments.push({ id: S.uid("c"), date: S.today(), type: "评语", text: d.text });
      S.save(); renderComments(body);
    }, "保存", { wide: true });
  });
}

function generateComments(cls) {
  const S = Store;
  const st = S.state.settings;
  UI.confirm("生成评语", `为 ${cls.name} 全班 ${cls.students.length} 人生成评语初稿？\n有 AI 密钥会用 AI 生成，没有则用智能模板。`, async () => {
    UI.toast("开始生成…");
    if (st.ai.enabled && st.ai.key) {
      await genByAI(cls);
    } else {
      cls.students.forEach(s => {
        const att = S.attRate(s);
        const words = [];
        words.push(s.name + "同学");
        if (s.gender === "男") words.push("本学期表现认真，");
        else words.push("本学期乖巧懂事，");
        if ((s.avg || 0) >= 90) words.push("学习成绩优秀，");
        else if ((s.avg || 0) >= 80) words.push("学习上比较稳定，");
        else if ((s.avg || 0) >= 70) words.push("学习上还有提升空间，");
        else words.push("学习上需要再加把劲，");
        if (att.rate >= 95) words.push("出勤情况非常好，");
        else if (att.rate < 80) words.push("希望下学期减少缺勤，");
        if ((s.points || 0) >= 50) words.push("课堂表现积极，积分为班内领先。");
        else if ((s.points || 0) >= 20) words.push("课堂上能主动参与。");
        else words.push("希望下学期多参与课堂互动。");
        words.push("下学期继续加油！");
        (s.comments || (s.comments = [])).push({ id: S.uid("c"), date: S.today(), type: "评语", text: words.join("") });
      });
      S.save(); renderComments(el("hvBody"));
      UI.toast("评语已生成（模板版），可逐条修改");
    }
  });
}

async function genByAI(cls) {
  const S = Store;
  const st = S.state.settings;
  const base = st.ai.url || "https://api.openai.com/v1";
  const url = base.replace(/\/$/, "") + "/chat/completions";
  const prompt = `你是小学班主任，请为以下学生各写一段期末评语，要求：\n- 每段60-100字，语气温和鼓励，不要出现"该生"这种官腔\n- 结合每个学生的特点（成绩、出勤率、积分、老师点评）\n- 不要直接引用分数数字，用"进步明显""稳定""还需努力"这类表述\n\n${cls.students.map(s => {
    const att = S.attRate(s);
    const c = (s.comments || []).filter(x => x.type !== "评语").slice(-3).map(x => x.text).join("；");
    return `姓名：${s.name}（${s.gender}）\n平均分：${s.avg || "无"}\n出勤率：${att.rate}%\n积分：${s.points || 0}\n老师点评：${c || "无"}`;
  }).join("\n\n")}\n\n请直接输出格式：\n学生姓名：评语内容\n每行一个学生。`;
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + st.ai.key },
      body: JSON.stringify({ model: st.ai.model || "gpt-4o-mini", messages: [{ role: "user", content: prompt }], temperature: 0.7 }),
    });
    if (!resp.ok) throw new Error("AI 接口返回 " + resp.status);
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || "";
    // 解析每行 "姓名：评语"
    content.split(/\r?\n/).forEach(line => {
      const m = line.match(/^(.+?)[：:](.+)$/);
      if (m) {
        const s = cls.students.find(x => x.name === m[1].trim());
        if (s) {
          if (!s.comments) s.comments = [];
          s.comments = s.comments.filter(x => x.type !== "评语");
          s.comments.push({ id: S.uid("c"), date: S.today(), type: "评语", text: m[2].trim() });
        }
      }
    });
    S.save(); renderComments(el("hvBody"));
    UI.toast("AI 评语已生成，逐条修改即可");
  } catch (e) {
    UI.toast("AI 生成失败：" + e.message + "，已改用模板", "err");
    cls.students.forEach(s => {
      (s.comments || (s.comments = [])).push({ id: S.uid("c"), date: S.today(), type: "评语", text: s.name + "同学本学期总体表现良好，希望下学期继续努力，取得更大进步！" });
    });
    S.save(); renderComments(el("hvBody"));
  }
}

/* ---- 家长会材料 ---- */
function renderMeeting(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const attAvg = cls.students.length ? Math.round(cls.students.reduce((a, s) => a + S.attRate(s).rate, 0) / cls.students.length) : 0;
  const lastEx = S.state.exams.filter(e => e.clsId === cls.id).pop();
  let html = `<div class="toolbar" style="margin-bottom:10px"><div class="tb-group">
    <span style="font-weight:700">家长会材料</span>
    <button class="btn sm primary" id="mtPrint">🖨 打印（班级概况 + 学生卡片）</button></div></div>`;
  html += `<div id="mtPrintArea">
    <div class="card"><div class="card-h">班级概况</div><div class="card-b">
      <div class="stat-strip">
        <div class="stat"><div class="num">${cls.students.length}</div><div class="lbl">人数</div></div>
        <div class="stat"><div class="num">${attAvg}%</div><div class="lbl">平均出勤</div></div>
        <div class="stat"><div class="num">${S.clsAvg(cls)}</div><div class="lbl">最近平均分</div></div>
        ${lastEx ? `<div class="stat brand"><div class="num">${S.escapeHtml(lastEx.name)}</div><div class="lbl">最近考试</div></div>` : ""}
      </div></div></div>
    <div class="card"><div class="card-h">学生评语小卡片</div><div class="card-b" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">` +
    cls.students.map(s => {
      const c = (s.comments || []).find(x => x.type === "评语");
      return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px">
        <b>${s.name}</b> <span class="muted small">积分${s.points || 0} · 出勤${S.attRate(s).rate}% · 均分${s.avg || "—"}</span>
        <div class="small" style="margin-top:6px">${c ? S.escapeHtml(c.text) : "（未生成评语）"}</div></div>`;
    }).join("") + `</div></div></div>`;
  body.innerHTML = html;
  el("mtPrint").onclick = () => {
    const area = el("mtPrintArea");
    const html2 = `<div class="print-title">${S.state.settings.school || ""} ${cls.name} 家长会材料</div>` + area.innerHTML;
    const ph = document.createElement("div");
    ph.style.display = "none"; ph.innerHTML = html2;
    document.body.appendChild(ph);
    document.title = "家长会材料";
    window.print();
    document.body.removeChild(ph);
  };
}

</script>
<script>
/* ============ 页面：事务 ============ */
"use strict";
const AV = { view: "todo" };
Pages.affairs = {
  render() {
    bindAV();
    renderAV();
  },
};
function bindAV() {
  document.querySelectorAll("[data-av]").forEach(b => b.onclick = () => {
    AV.view = b.dataset.av;
    document.querySelectorAll("[data-av]").forEach(x => x.classList.toggle("active", x === b));
    renderAV();
  });
}
function renderAV() {
  const body = el("avBody");
  if (AV.view === "todo") renderTodos(body);
  else if (AV.view === "note") renderNotes(body);
  else if (AV.view === "checkin") renderCheckins(body);
  else if (AV.view === "fund") renderFunds(body);
  else if (AV.view === "duty") renderDuty(body);
  else if (AV.view === "workload") renderWorkload(body);
  else if (AV.view === "pomodoro") renderPomodoro(body);
  else renderLinks(body);
}

/* ---- 待办 ---- */
function renderTodos(body) {
  const S = Store;
  const list = S.state.todos;
  let html = `<div class="todo-add">
    <input class="input" id="todoInput" placeholder="要办的事，回车添加…">
    <button class="btn primary" id="todoAdd">添加</button>
    <button class="btn" id="todoClear">清除已完成</button></div>`;
  const sorted = list.slice().sort((a, b) => {
    const ad = a.done ? 1 : 0, bd = b.done ? 1 : 0;
    if (ad !== bd) return ad - bd;
    return (a.due || "9999") < (b.due || "9999") ? -1 : 1;
  });
  html += `<div class="todo-list">` + sorted.map(t => {
    const over = !t.done && t.due && t.due < S.today();
    return `<div class="todo-item ${over ? "overdue" : ""} ${t.done ? "done" : ""}" data-id="${t.id}">
      <span class="chk">✓</span>
      <span style="flex:1">${S.escapeHtml(t.text)}${t.repeat ? `<span class="tag" style="margin-left:6px">${t.repeat === "daily" ? "每天" : t.repeat === "weekly" ? "每周" : "每月"}</span>` : ""}</span>
      <span class="due">${t.due || ""}</span>
      <button class="btn sm danger" data-tdel="${t.id}">删</button></div>`;
  }).join("") + `</div>`;
  if (!list.length) html += `<div class="empty"><div class="big">📌</div>没有待办。上面输入，回车即添加</div>`;
  body.innerHTML = html;

  const input = el("todoInput");
  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    S.state.todos.push({ id: S.uid("td"), text, due: "", done: false, repeat: "", createdAt: S.today() });
    S.save(); input.value = ""; renderTodos(body); App.updateBadges();
  }
  el("todoAdd").onclick = addTodo;
  input.onkeydown = e => { if (e.key === "Enter") addTodo(); };
  el("todoClear").onclick = () => {
    const doneCount = list.filter(t => t.done).length;
    if (doneCount) { S.state.todos = list.filter(t => !t.done); S.save(); renderTodos(body); UI.toast("已清除 " + doneCount + " 条"); }
  };
  body.querySelectorAll(".todo-item").forEach(item => {
    item.querySelector(".chk").onclick = (e) => {
      e.stopPropagation();
      const t = list.find(x => x.id === item.dataset.id);
      if (t) {
        t.done = !t.done;
        // 重复任务：完成后自动生成下一次
        if (t.done && t.repeat) {
          const nextDate = t.repeat === "daily" ? S.addDays(S.today(), 1) : t.repeat === "weekly" ? S.addDays(S.today(), 7) : S.addDays(S.today(), 30);
          S.state.todos.push({ id: S.uid("td"), text: t.text, due: nextDate, done: false, repeat: t.repeat, createdAt: S.today() });
        }
        S.save(); renderTodos(body); App.updateBadges();
      }
    };
    item.onclick = () => {
      const t = list.find(x => x.id === item.dataset.id);
      UI.form("编辑待办", [
        { key: "text", label: "内容", type: "text", required: true, value: t.text },
        { key: "due", label: "截止日期", type: "date", value: t.due },
        { key: "repeat", label: "重复", type: "select", value: t.repeat, options: [{ v: "", t: "不重复" }, { v: "daily", t: "每天" }, { v: "weekly", t: "每周" }, { v: "monthly", t: "每月" }] },
      ], d => { Object.assign(t, d); S.save(); renderTodos(body); App.updateBadges(); });
    };
  });
  body.querySelectorAll("[data-tdel]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    S.state.todos = list.filter(x => x.id !== b.dataset.tdel);
    S.save(); renderTodos(body); App.updateBadges();
  });
}

/* ---- 随手记 ---- */
function renderNotes(body) {
  const S = Store;
  const list = S.state.notes;
  let html = `<div class="todo-add">
    <input class="input" id="noteInput" placeholder="临时想到什么记一句，回车添加…">
    <button class="btn primary" id="noteAdd">记下</button></div>`;
  html += list.slice().reverse().map(n => `<div class="plan-row">
    <div class="info"><b>${S.escapeHtml(n.text)}</b></div>
    <span class="muted small">${n.date}</span>
    <button class="btn sm" data-note-done="${n.id}">${n.done ? "取消完成" : "完成"}</button>
    <button class="btn sm danger" data-note-del="${n.id}">删</button></div>`).join("") ||
    `<div class="empty"><div class="big">🗒</div>还没有随手记</div>`;
  body.innerHTML = html;
  const input = el("noteInput");
  el("noteAdd").onclick = () => {
    const text = input.value.trim();
    if (!text) return;
    S.state.notes.push({ id: S.uid("nt"), text, date: S.today(), done: false });
    S.save(); input.value = ""; renderNotes(body);
  };
  input.onkeydown = e => { if (e.key === "Enter") el("noteAdd").onclick(); };
  body.querySelectorAll("[data-note-del]").forEach(b => b.onclick = () => {
    S.state.notes = list.filter(x => x.id !== b.dataset.noteDel);
    S.save(); renderNotes(body);
  });
  body.querySelectorAll("[data-note-done]").forEach(b => b.onclick = () => {
    const n = list.find(x => x.id === b.dataset.noteDone);
    if (n) { n.done = !n.done; S.save(); renderNotes(body); }
  });
}

/* ---- 习惯打卡 ---- */
function renderCheckins(body) {
  const S = Store;
  const list = S.state.checkins;
  let html = `<div style="margin-bottom:12px"><button class="btn primary sm" id="ckAdd">＋ 新建打卡习惯</button></div>`;
  html += `<div class="checkin-grid">` + list.map(c => {
    const dates = Object.keys(c.dates).sort();
    let streak = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      if (c.dates[dates[i]]) {
        const expect = S.addDays(S.today(), -(dates.length - 1 - i));
        if (dates[i] === expect) streak++; else break;
      } else break;
    }
    return `<div class="checkin-card">
      <div style="display:flex;align-items:center;gap:8px"><b>${S.escapeHtml(c.name)}</b>
      <span class="tag orange">连续 ${streak} 天</span></div>
      <div class="checkin-days">` + recent30().map(d => {
        const on = c.dates[d];
        return `<span class="cd-cell ${on ? "on" : ""} ${d === S.today() ? "today" : ""}" data-ck="${c.id}" data-d="${d}" style="cursor:pointer">${Number(d.slice(8))}</span>`;
      }).join("") + `</div>
      <button class="btn sm danger" data-ckdel="${c.id}" style="margin-top:8px">删除</button></div>`;
  }).join("") + `</div>`;
  if (!list.length) html += `<div class="empty"><div class="big">✅</div>还没有打卡习惯，比如「每天写一条教学反思」</div>`;
  body.innerHTML = html;
  el("ckAdd").onclick = () => UI.form("新建打卡", [
    { key: "name", label: "习惯名称", type: "text", required: true, placeholder: "如：每天写一条教学反思" },
  ], d => { S.state.checkins.push({ id: S.uid("ck"), name: d.name, dates: {} }); S.save(); renderCheckins(body); });
  body.querySelectorAll(".cd-cell").forEach(c => c.onclick = () => {
    const item = S.state.checkins.find(x => x.id === c.dataset.ck);
    if (item) {
      const d = c.dataset.d;
      if (item.dates[d]) delete item.dates[d];
      else item.dates[d] = true;
      S.save(); renderCheckins(body);
    }
  });
  body.querySelectorAll("[data-ckdel]").forEach(b => b.onclick = () => {
    S.state.checkins = S.state.checkins.filter(x => x.id !== b.dataset.ckdel);
    S.save(); renderCheckins(body);
  });
}
function recent30() {
  const arr = [];
  for (let i = 29; i >= 0; i--) arr.push(Store.addDays(Store.today(), -i));
  return arr;
}

/* ---- 班费 ---- */
function renderFunds(body) {
  const S = Store;
  const list = S.state.funds;
  const total = list.reduce((a, f) => a + (f.type === "in" ? f.amount : -f.amount), 0);
  const income = list.filter(f => f.type === "in").reduce((a, f) => a + f.amount, 0);
  const spend = list.filter(f => f.type === "out").reduce((a, f) => a + f.amount, 0);
  let html = `<div class="stat-strip">
    <div class="stat brand"><div class="num">¥${total}</div><div class="lbl">结余</div></div>
    <div class="stat ok"><div class="num">¥${income}</div><div class="lbl">总收入</div></div>
    <div class="stat danger"><div class="num">¥${spend}</div><div class="lbl">总支出</div></div></div>`;
  html += `<div style="margin-bottom:10px"><button class="btn sm primary" id="fundIn">＋ 收入</button>
    <button class="btn sm" id="fundOut">－ 支出</button>
    <button class="btn sm" id="fundExport">导出给家委会</button></div>`;
  html += list.slice().reverse().map(f => `<div class="plan-row">
    <div class="info"><b>${f.type === "in" ? "收" : "支"}</b> <span class="tag ${f.type === "in" ? "green" : "orange"}">¥${f.amount}</span> ${S.escapeHtml(f.note || "")}</div>
    <span class="muted small">${f.date}</span>
    <button class="btn sm danger" data-fdel="${f.id}">删</button></div>`).join("") ||
    `<div class="empty"><div class="big">💰</div>还没有班费记录</div>`;
  body.innerHTML = html;
  el("fundIn").onclick = () => fundModal("in");
  el("fundOut").onclick = () => fundModal("out");
  el("fundExport").onclick = () => {
    const rows = [["日期", "类型", "金额", "备注"]];
    list.forEach(f => rows.push([f.date, f.type === "in" ? "收入" : "支出", f.amount, f.note || ""]));
    UI.exportCSV("班费明细.csv", rows);
  };
  body.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => {
    S.state.funds = S.state.funds.filter(f => f.id !== b.dataset.fdel);
    S.save(); renderFunds(body);
  });
}
function fundModal(type) {
  const S = Store;
  UI.form(type === "in" ? "记录收入" : "记录支出", [
    { key: "date", label: "日期", type: "date", value: S.today() },
    { key: "amount", label: "金额", type: "number", required: true },
    { key: "note", label: "备注", type: "text", required: true, placeholder: "如：班费收取 / 购买图书" },
  ], d => { S.state.funds.push({ id: S.uid("f"), date: d.date, type, amount: d.amount, note: d.note }); S.save(); renderFunds(el("avBody")); });
}

/* ---- 值日排班 ---- */
function renderDuty(body) {
  const S = Store, cls = S.curClass();
  const duty = S.state.duty;
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><span style="font-weight:700">值日排班</span>
    <button class="btn sm primary" id="dyShift">＋ 岗位</button>
    <button class="btn sm" id="dyNext">轮到下一位</button></div></div>`;
  if (cls && duty.shifts.length) {
    html += duty.shifts.map((sh, i) => {
      const sid = duty.students[(duty.rotate + i) % duty.students.length];
      const s = cls.students.find(x => x.id === sid);
      return `<div class="duty-row"><span style="font-weight:600;width:70px">${S.escapeHtml(sh.name)}</span>
        <b>${s ? UI.nameOf(s) : "—"}</b><span class="muted small">本周</span>
        <button class="btn sm danger" data-shdel="${sh.id}" style="margin-left:auto">删</button></div>`;
    }).join("");
  } else {
    html += `<div class="empty"><div class="big">🧹</div>${duty.shifts.length ? "先创建班级" : "还没设置岗位。点「＋ 岗位」添加（黑板、地面、窗台…）"}</div>`;
  }
  body.innerHTML = html;
  el("dyNext").onclick = () => {
    if (!duty.students.length) { UI.toast("先在班级录入学生", "err"); return; }
    duty.rotate = (duty.rotate + 1) % duty.students.length;
    duty.records.push({ date: S.today(), rotate: duty.rotate });
    S.save(); renderDuty(body); UI.toast("已轮转");
  };
  el("dyShift").onclick = () => UI.form("添加岗位", [
    { key: "name", label: "岗位", type: "text", required: true, placeholder: "如：黑板 / 地面 / 窗台" },
  ], d => { duty.shifts.push({ id: S.uid("sh"), name: d.name }); S.save(); renderDuty(body); });
  body.querySelectorAll("[data-shdel]").forEach(b => b.onclick = () => {
    duty.shifts = duty.shifts.filter(x => x.id !== b.dataset.shdel);
    S.save(); renderDuty(body);
  });
}

/* ---- 工作量 ---- */
function renderWorkload(body) {
  const S = Store, cls = S.curClass();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  const odd = S.isOddWeek(S.today());
  let html = `<div class="toolbar" style="margin-bottom:10px"><div class="tb-group"><span style="font-weight:700">近半年课时统计</span></div></div>`;
  html += `<div class="card"><div class="card-b">`;
  const counts = months.map(m => {
    let n = 0;
    const [yy, mm] = m.split("-").map(Number);
    const days = new Date(yy, mm, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const dateStr = `${m}-${String(d).padStart(2, "0")}`;
      const w = S.weekday(dateStr);
      if (S.isHoliday(dateStr)) continue;
      n += S.state.timetable.courses.filter(c => c.day === w && (!c.biweekly || (c.biweekly === "A") === odd)).length;
    }
    return { m, n };
  });
  const max = Math.max(1, ...counts.map(c => c.n));
  counts.forEach(c => {
    html += `<div class="plan-row"><div class="info"><b>${c.m}</b></div>
      <div style="flex:0 0 40%;height:10px;background:var(--line-2);border-radius:5px;overflow:hidden"><div style="width:${Math.round(c.n / max * 100)}%;height:100%;background:var(--brand)"></div></div>
      <div class="date">${c.n} 节</div></div>`;
  });
  const adj = S.state.workloadAdj;
  html += `<div style="margin-top:12px"><b>调课代课台账</b></div>`;
  html += adj.map(a => `<div class="plan-row"><div class="info">${S.escapeHtml(a.note)}</div><span class="muted small">${a.date}</span>
    <button class="btn sm danger" data-wdel="${a.id}">删</button></div>`).join("") || `<div class="muted small">无记录。调课代课记在「课表 → 调课记录」里。</div>`;
  html += `</div></div>`;
  body.innerHTML = html;
  body.querySelectorAll("[data-wdel]").forEach(b => b.onclick = () => {
    S.state.workloadAdj = adj.filter(a => a.id !== b.dataset.wdel);
    S.save(); renderWorkload(body);
  });
}

/* ---- 番茄钟 ---- */
const POMO = { running: false, left: 25 * 60, total: 25 * 60, timer: null };
function renderPomodoro(body) {
  body.innerHTML = `
    <div style="max-width:420px;margin:20px auto;text-align:center">
      <div class="pomo-display ${POMO.running ? "running" : ""}" id="pomoNum">25:00</div>
      <div class="timer-btns" style="margin-top:10px">
        <button class="cm-btn" id="pomoStart">▶ 开始</button>
        <button class="cm-btn ghost" id="pomoReset">重置</button>
      </div>
      <div style="margin-top:24px"><div class="small muted">专注时段</div>
        <div class="timer-btns">
          <button class="timer-preset" data-p="15">15分</button>
          <button class="timer-preset" data-p="25">25分</button>
          <button class="timer-preset" data-p="45">45分</button>
        </div>
      </div>
    </div>`;
  const num = el("pomoNum");
  num.textContent = fmtPomo(POMO.left);
  el("pomoStart").onclick = () => {
    if (POMO.running) { clearInterval(POMO.timer); POMO.running = false; el("pomoStart").textContent = "▶ 继续"; el("pomoNum").classList.remove("running"); }
    else {
      POMO.running = true; el("pomoStart").textContent = "⏸ 暂停"; el("pomoNum").classList.add("running");
      POMO.timer = setInterval(() => {
        POMO.left--;
        num.textContent = fmtPomo(POMO.left);
        if (POMO.left <= 0) {
          clearInterval(POMO.timer); POMO.running = false;
          el("pomoStart").textContent = "▶ 开始";
          el("pomoNum").classList.remove("running");
          UI.toast("⏰ 时间到！休息一下吧");
          try { new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play(); } catch (e) {}
        }
      }, 1000);
    }
  };
  el("pomoReset").onclick = () => { clearInterval(POMO.timer); POMO.running = false; POMO.left = POMO.total; num.textContent = fmtPomo(POMO.left); el("pomoStart").textContent = "▶ 开始"; el("pomoNum").classList.remove("running"); };
  body.querySelectorAll(".timer-preset").forEach(b => b.onclick = () => {
    clearInterval(POMO.timer); POMO.running = false; POMO.total = POMO.left = Number(b.dataset.p) * 60;
    num.textContent = fmtPomo(POMO.left); el("pomoStart").textContent = "▶ 开始"; el("pomoNum").classList.remove("running");
  });
}
function fmtPomo(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ================= 档案（评职称） ================= */
const AR = { type: "", year: "" };
Pages.archive = {
  render() {
    bindAR();
    renderAR();
  },
};
function bindAR() {
  el("arAdd").onclick = arModal;
  el("arExport").onclick = () => {
    const rows = [["类型", "日期", "名称", "级别", "学时", "备注", "证书位置"]];
    filterArchives().forEach(a => rows.push([a.type, a.date, a.name, a.level || "", a.hours || "", a.note || "", a.folder || ""]));
    UI.exportCSV("职称材料总表.csv", rows);
  };
  el("arPrint").onclick = () => { document.title = "职称材料"; window.print(); };
  el("arType").onchange = () => { AR.type = el("arType").value; renderAR(); };
  el("arYear").onchange = () => { AR.year = el("arYear").value; renderAR(); };
}
function filterArchives() {
  const S = Store;
  return S.state.archives.filter(a => (!AR.type || a.type === AR.type) && (!AR.year || String(a.date || "").startsWith(AR.year)));
}
function renderAR() {
  const S = Store;
  const list = S.state.archives;
  const total = list.length;
  const hours = list.filter(a => a.type === "培训" && a.hours).reduce((a, b) => a + Number(b.hours || 0), 0);
  const lessons = list.filter(a => a.type === "听课").length;
  const open = list.filter(a => a.type === "公开课").length;
  const years = [...new Set(list.map(a => (a.date || "").slice(0, 4)).filter(Boolean))];

  // 类型下拉
  const types = ["公开课", "论文", "获奖", "培训", "听课", "带教", "课题", "其他"];
  el("arType").innerHTML = `<option value="">全部类型</option>` + types.map(t => `<option value="${t}" ${AR.type === t ? "selected" : ""}>${t}</option>`).join("");
  el("arYear").innerHTML = `<option value="">全部年份</option>` + years.sort().reverse().map(y => `<option value="${y}" ${AR.year === y ? "selected" : ""}>${y}</option>`).join("");

  el("arStats").innerHTML = `
    <div class="stat brand"><div class="num">${total}</div><div class="lbl">总条数</div></div>
    <div class="stat"><div class="num">${hours}</div><div class="lbl">继续教育学时${hours < 72 ? "（差" + (72 - hours) + "）" : "✓"}</div></div>
    <div class="stat"><div class="num">${lessons}</div><div class="lbl">听课节数</div></div>
    <div class="stat"><div class="num">${open}</div><div class="lbl">公开课</div></div>`;

  const filtered = filterArchives();
  const colorMap = { "公开课": "#2563eb", "论文": "#7c3aed", "获奖": "#d97706", "培训": "#0891b2", "听课": "#16a34a", "带教": "#db2777", "课题": "#65a30d", "其他": "#6b7280" };
  let html = filtered.map(a => `<div class="ar-row">
    <span class="type" style="background:${colorMap[a.type] || "#6b7280"}1a;color:${colorMap[a.type] || "#6b7280"}">${a.type}</span>
    <div style="flex:1;min-width:0"><b>${S.escapeHtml(a.name)}</b>
      <div class="small muted">${a.date || ""}${a.level ? " · " + a.level : ""}${a.hours ? " · " + a.hours + "学时" : ""}${a.folder ? " · 📁" + S.escapeHtml(a.folder) : ""}</div>
      ${a.note ? `<div class="small" style="color:var(--text-2)">💡 ${S.escapeHtml(a.note)}</div>` : ""}</div>
    <button class="btn sm" data-are="${a.id}">编辑</button>
    <button class="btn sm danger" data-ard="${a.id}">删</button></div>`).join("") ||
    `<div class="empty"><div class="big">🗃</div>还没有档案记录。公开课、论文、获奖、培训学时…评职称都要用</div>`;
  el("arBody").innerHTML = html;

  el("arBody").querySelectorAll("[data-are]").forEach(b => b.onclick = () => arModal(list.find(a => a.id === b.dataset.are)));
  el("arBody").querySelectorAll("[data-ard]").forEach(b => b.onclick = () => {
    const a = list.find(x => x.id === b.dataset.ard);
    UI.confirm("删除档案", `删除「${a.name}」？`, () => {
      S.state.archives = list.filter(x => x.id !== a.id);
      S.save(); renderAR();
    }, "删除", true);
  });
}
function arModal(a) {
  const S = Store;
  UI.form(a ? "编辑档案" : "新增档案", [
    { key: "type", label: "类型", type: "select", value: a?.type || "公开课", options: ["公开课", "论文", "获奖", "培训", "听课", "带教", "课题", "其他"].map(t => ({ v: t, t })) },
    { key: "date", label: "日期", type: "date", value: a?.date || S.today() },
    { key: "name", label: "名称", type: "text", required: true, value: a?.name || "", placeholder: "如：区级数学公开课" },
    { key: "level", label: "级别", type: "select", value: a?.level || "", options: [{ v: "", t: "—" }, { v: "校级", t: "校级" }, { v: "区级", t: "区级" }, { v: "市级", t: "市级" }, { v: "省级", t: "省级" }, { v: "国家级", t: "国家级" }] },
    { key: "hours", label: "学时", type: "number", value: a?.hours || 0 },
    { key: "folder", label: "证书位置", type: "text", value: a?.folder || "", placeholder: "如：D:/材料/证书/" },
    { key: "note", label: "备注", type: "textarea", value: a?.note || "", placeholder: "听课记录写：这节课好在哪、我能借鉴什么" },
  ], d => {
    if (a) Object.assign(a, d);
    else S.state.archives.push({ id: S.uid("ar"), ...d });
    S.save(); renderAR();
  }, "保存", { wide: true });
}

/* ---- 常用链接 ---- */
function renderLinks(body) {
  const S = Store;
  const list = S.state.links;
  let html = `<div style="margin-bottom:12px"><button class="btn primary sm" id="lkAdd">＋ 添加链接</button></div>`;
  html += `<div class="links-grid">` + list.map(l => `
    <div class="link-card" data-lid="${l.id}">
      <span class="fav">${S.escapeHtml(l.ico || "🔗")}</span>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${S.escapeHtml(l.name)}</div>
      <div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${S.escapeHtml(l.url || "")}</div></div>
      <button class="btn sm danger" data-lkdel="${l.id}" style="flex:none">删</button>
    </div>`).join("") + `</div>`;
  if (!list.length) html += `<div class="empty"><div class="big">🔗</div>教育局系统、学校OA、课件文件夹…放这里点一下就开</div>`;
  body.innerHTML = html;
  el("lkAdd").onclick = () => UI.form("添加链接", [
    { key: "name", label: "名称", type: "text", required: true, placeholder: "如：教育局系统" },
    { key: "url", label: "网址", type: "text", placeholder: "https://… 或文件夹路径" },
    { key: "ico", label: "图标", type: "text", value: "🔗" },
  ], d => { S.state.links.push({ id: S.uid("lk"), ...d }); S.save(); renderLinks(body); });
  body.querySelectorAll(".link-card").forEach(c => c.onclick = () => {
    const l = S.state.links.find(x => x.id === c.dataset.lid);
    if (l && l.url) {
      if (/^https?:/.test(l.url)) window.open(l.url, "_blank");
      else UI.toast("本地路径，在电脑上打开：" + l.url);
    }
  });
  body.querySelectorAll("[data-lkdel]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    S.state.links = S.state.links.filter(x => x.id !== b.dataset.lkdel);
    S.save(); renderLinks(body);
  });
}

</script>
<script>
/* ============ 上课模式：全屏7工具 ============ */
"use strict";
const ClassMode = (() => {
  let open = false;
  let tool = "pick";
  let timer = null;
  const PICK = { pool: [], done: [], idx: -1, labels: [] };
  const CM = { spin: null };

  function el(id) { return document.getElementById(id); }
  function box() { return el("cmBody"); }

  function openMode() {
    open = true;
    el("classMode").hidden = false;
    el("btnClassMode").classList.add("active");
    document.querySelectorAll(".cm-tool").forEach(b => {
      b.onclick = () => switchTool(b.dataset.cm);
    });
    el("cmExit").onclick = () => closeMode();
    switchTool("pick");
  }
  function closeMode() {
    open = false;
    el("classMode").hidden = true;
    el("btnClassMode").classList.remove("active");
    clearInterval(timer);
    clearInterval(CM.spin);
    document.querySelectorAll(".cm-lbox").forEach(b => b.remove());
  }
  function switchTool(t) {
    tool = t;
    document.querySelectorAll(".cm-tool").forEach(b => b.classList.toggle("active", b.dataset.cm === t));
    renderTool();
  }

  function renderTool() {
    const b = box();
    b.className = "cm-body";
    if (tool === "pick") renderPick(b);
    else if (tool === "draw") renderDraw(b);
    else if (tool === "group") renderGroupTool(b);
    else if (tool === "timer") renderTimer(b);
    else if (tool === "comment") renderComment(b);
    else if (tool === "vote") renderVote(b);
    else renderSeatPick(b);
  }

  function activeStudents() {
    // 排除今天缺勤/请假的学生
    const cls = Store.curClass();
    if (!cls) return [];
    const today = Store.today();
    return cls.students.filter(s => {
      const v = s.att && s.att[today];
      return v !== "absent" && v !== "leave";
    });
  }

  /* ---------- 1 随机点名 ---------- */
  function renderPick(b) {
    const list = activeStudents();
    PICK.labels = Store.state.settings.labels;
    if (!list.length) { b.innerHTML = `<div class="cm-hint">先创建班级并录入学生</div>`; return; }
    if (!PICK.pool.length) { PICK.pool = list.slice(); PICK.done = []; PICK.idx = -1; }
    b.innerHTML = `
      <div class="cm-hint">按 <b>空格</b> 开始滚动点名 · 缺勤/请假已自动排除 · 本轮不重复</div>
      <div class="cm-big" id="pickNum">${PICK.pool.length}</div>
      <div class="cm-sub" id="pickName">就绪，共 ${PICK.pool.length} 人待抽</div>
      <div style="display:flex;gap:12px;margin-top:30px">
        <button class="cm-btn" id="pickStart">开始点名</button>
        <button class="cm-btn ghost" id="pickReset">重置本轮</button>
      </div>
      <div class="cm-labels" id="pickLabels" style="display:none"></div>`;
    el("pickStart").onclick = spinPick;
    el("pickReset").onclick = () => { PICK.pool = activeStudents(); PICK.done = []; renderPick(b); };
    window._cmKey = (e) => {
      if (e.code === "Space") { e.preventDefault(); spinPick(); }
      else if (e.key >= "1" && e.key <= "7") switchTool({ 1: "pick", 2: "draw", 3: "group", 4: "timer", 5: "comment", 6: "vote", 7: "seat" }[e.key]);
    };
  }
  function spinPick() {
    const b = box();
    const nameEl = el("pickNum");
    if (!nameEl) return;
    if (PICK.pool.length === 0) { UI.toast("本轮已全部点完，点重置再来", "err"); return; }
    clearInterval(CM.spin);
    CM.spin = setInterval(() => {
      const s = PICK.pool[Math.floor(Math.random() * PICK.pool.length)];
      nameEl.textContent = UI.nameOf(s);
    }, 60);
    setTimeout(() => {
      clearInterval(CM.spin);
      const idx = Math.floor(Math.random() * PICK.pool.length);
      const s = PICK.pool.splice(idx, 1)[0];
      PICK.done.push(s);
      flashName(s, b);
    }, 1600);
  }
  function flashName(s, b) {
    const nameEl = el("pickNum");
    nameEl.textContent = UI.nameOf(s);
    el("pickName").textContent = `已点 ${PICK.done.length} 人 · 剩余 ${PICK.pool.length} 人`;
    // 点评标签
    const labels = PICK.labels;
    const box2 = el("pickLabels");
    box2.style.display = "flex";
    box2.innerHTML = labels.map(l => `<button class="cm-label ${l.score < 0 ? "minus" : ""}" data-label="${l.text}" data-score="${l.score}">${l.text} ${l.score > 0 ? "+" : ""}${l.score}</button>`).join("") +
      `<button class="cm-label" data-eval="好">答得好 +1</button><button class="cm-label" data-eval="中">一般</button><button class="cm-label minus" data-eval="差">待加强 -1</button>`;
    box2.querySelectorAll("[data-label]").forEach(btn => btn.onclick = () => {
      addPoints(s, Number(btn.dataset.score), btn.dataset.label);
      hideLabels();
    });
    box2.querySelectorAll("[data-eval]").forEach(btn => btn.onclick = () => {
      const t = btn.dataset.eval;
      const delta = t === "好" ? 1 : t === "差" ? -1 : 0;
      addPoints(s, delta, "课堂表现：" + (t === "好" ? "答得好" : t === "中" ? "一般" : "待加强"));
      hideLabels();
    });
    function hideLabels() { box2.style.display = "none"; }
  }
  function addPoints(s, delta, reason) {
    const cls = Store.curClass();
    s.points = (s.points || 0) + delta;
    (s.pointLog || (s.pointLog = [])).push({ date: Store.today(), delta, reason });
    (cls?.badgeDefs || []).forEach(bd => {
      if (s.points >= bd.threshold && !(s.badges || []).includes(bd.name)) {
        (s.badges || (s.badges = [])).push(bd.name);
        UI.toast(`🏅 ${s.name} 获得勋章「${bd.name}」`);
      }
    });
    Store.save();
    showFlash(delta > 0 ? "+" + delta : String(delta));
  }
  function showFlash(text) {
    const f = document.createElement("div");
    f.className = "cm-flash";
    f.innerHTML = `<div class="f">${text}</div>`;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }

  /* ---------- 2 抽签 ---------- */
  function renderDraw(b) {
    const list = activeStudents();
    const names = list.map(s => s.name);
    b.innerHTML = `
      <div class="cm-hint">抽题号、抽任务、抽奖品都行，名单可自己改</div>
      <div style="display:flex;gap:10px;width:100%;max-width:600px;margin-bottom:16px">
        <input class="input" id="drawNames" value="${names.join("、")}" style="flex:1;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)">
        <input class="input" id="drawCount" type="number" value="1" style="width:70px;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)">
      </div>
      <button class="cm-btn" id="drawGo">开始抽签</button>
      <div id="drawResult" style="margin-top:24px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center"></div>`;
    el("drawGo").onclick = () => {
      const names = el("drawNames").value.split(/[、,，\s]+/).filter(Boolean);
      const n = Math.min(Number(el("drawCount").value) || 1, names.length);
      clearInterval(CM.spin);
      const res = el("drawResult");
      CM.spin = setInterval(() => {
        res.innerHTML = names.sort(() => Math.random() - 0.5).slice(0, n).map(x => `<div class="cm-card">${x}</div>`).join("");
      }, 70);
      setTimeout(() => {
        clearInterval(CM.spin);
        res.innerHTML = names.sort(() => Math.random() - 0.5).slice(0, n).map(x => `<div class="cm-card picked">${x}</div>`).join("");
      }, 1500);
    };
  }

  /* ---------- 3 随机分组 ---------- */
  function renderGroupTool(b) {
    const list = activeStudents();
    b.innerHTML = `
      <div class="cm-hint">随机分组，当场分完</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
        <label class="muted">组数</label><input class="input" id="grpNum" type="number" value="4" style="width:80px;background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)">
        <button class="cm-btn" id="grpGo">分组</button>
      </div>
      <div id="grpResult" style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center"></div>`;
    el("grpGo").onclick = () => {
      const n = Math.max(1, Number(el("grpNum").value) || 4);
      const shuffled = list.slice().sort(() => Math.random() - 0.5);
      const groups = Array.from({ length: n }, () => []);
      shuffled.forEach((s, i) => groups[i % n].push(s));
      el("grpResult").innerHTML = groups.map((g, i) => `<div class="cm-card" style="width:auto;min-width:150px;height:auto;padding:16px;flex-direction:column;gap:8px">
        <b>第${i + 1}组</b>${g.map(s => `<span style="font-size:18px">${UI.nameOf(s)}</span>`).join("")}</div>`).join("");
    };
  }

  /* ---------- 4 计时器 ---------- */
  let TMR = { total: 300, left: 300, running: false };
  function renderTimer(b) {
    b.innerHTML = `
      <div class="timer-wrap">
        <div class="timer-num ${TMR.left <= 10 ? "warn10" : ""}" id="tmrNum">${fmt(TMR.left)}</div>
        <div class="timer-btns">
          <button class="cm-btn" id="tmrGo">⏱ 开始（空格）</button>
          <button class="cm-btn ghost" id="tmrReset">重置</button>
        </div>
        <div class="timer-btns">
          <button class="timer-preset" data-s="60">1分</button>
          <button class="timer-preset" data-s="180">3分</button>
          <button class="timer-preset" data-s="300">5分</button>
          <button class="timer-preset" data-s="600">10分</button>
          <button class="timer-preset" data-s="900">15分</button>
        </div>
      </div>`;
    const num = el("tmrNum");
    num.textContent = fmt(TMR.left);
    el("tmrGo").onclick = toggleTmr;
    el("tmrReset").onclick = () => { clearInterval(timer); TMR.running = false; TMR.left = TMR.total; num.textContent = fmt(TMR.left); num.classList.remove("warn10"); el("tmrGo").textContent = "⏱ 开始（空格）"; };
    b.querySelectorAll("[data-s]").forEach(btn => btn.onclick = () => {
      clearInterval(timer); TMR.running = false;
      TMR.total = TMR.left = Number(btn.dataset.s);
      num.textContent = fmt(TMR.left); num.classList.remove("warn10");
      el("tmrGo").textContent = "⏱ 开始（空格）";
    });
    window._cmKey = (e) => {
      if (e.code === "Space") { e.preventDefault(); toggleTmr(); }
      else if (e.key >= "1" && e.key <= "7") switchTool({ 1: "pick", 2: "draw", 3: "group", 4: "timer", 5: "comment", 6: "vote", 7: "seat" }[e.key]);
    };
  }
  function toggleTmr() {
    const num = el("tmrNum");
    if (TMR.running) { clearInterval(timer); TMR.running = false; el("tmrGo").textContent = "⏱ 继续（空格）"; return; }
    TMR.running = true;
    el("tmrGo").textContent = "⏸ 暂停（空格）";
    timer = setInterval(() => {
      TMR.left--;
      num.textContent = fmt(TMR.left);
      if (TMR.left <= 10) num.classList.add("warn10");
      if (TMR.left <= 0) {
        clearInterval(timer); TMR.running = false;
        el("tmrGo").textContent = "⏱ 开始（空格）";
        num.classList.remove("warn10");
        UI.toast("⏰ 时间到！");
        try { new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play(); } catch (e) {}
      }
    }, 1000);
  }
  function fmt(s) { return String(Math.floor(Math.max(0, s) / 60)).padStart(2, "0") + ":" + String(Math.max(0, s) % 60).padStart(2, "0"); }

  /* ---------- 5 课堂点评 ---------- */
  const CMN = { last: null };
  function renderComment(b) {
    const cls = Store.curClass();
    const list = cls ? cls.students : [];
    const labels = Store.state.settings.labels;
    if (!list.length) { b.innerHTML = `<div class="cm-hint">先创建班级</div>`; return; }
    b.className = "cm-body wrap";
    b.innerHTML = list.map((s, i) => {
      const today = Store.today();
      const absent = s.att && (s.att[today] === "absent" || s.att[today] === "leave");
      return `<div class="cm-card ${absent ? "gray" : ""}" data-sid="${s.id}" style="background:${UI.colorOf(i)}33;border-color:${UI.colorOf(i)}">
        <div>${UI.nameOf(s)}<br><span style="font-size:16px;color:#fbbf24">${s.points || 0}</span></div></div>`;
    }).join("");
    // 右侧积分榜
    const ptsBox = document.createElement("div");
    ptsBox.className = "cm-pts";
    ptsBox.innerHTML = `<h4>积分榜 TOP6</h4>` + list.slice().sort((a, c) => (c.points || 0) - (a.points || 0)).slice(0, 6)
      .map(s => `<div class="pt-row"><span>${UI.nameOf(s)}</span><b>${s.points || 0}</b></div>`).join("");
    b.parentElement.appendChild(ptsBox);
    const closePts = () => ptsBox.remove();
    // 顶部加小组加分和撤销
    const top = document.createElement("div");
    top.style.cssText = "position:absolute;right:30px;top:64px;left:0;display:flex;justify-content:center;gap:10px;z-index:2";
    top.innerHTML = `
      <button class="cm-btn ghost" id="cmnGroup">＋ 小组加分</button>
      <button class="cm-btn ghost" id="cmnUndo">↩ 撤销上一条</button>`;
    b.appendChild(top);
    el("cmnGroup").onclick = () => {
      const groups = [...new Set(list.map(s => s.group).filter(Boolean))];
      UI.form("小组加分", [
        { key: "g", label: "小组", type: "select", options: groups.map(g => ({ v: g, t: g })) },
        { key: "delta", label: "分值", type: "number", value: 1 },
        { key: "reason", label: "原因", type: "text", value: "小组表现" },
      ], d => {
        list.filter(s => s.group === d.g).forEach(s => addPoints(s, d.delta, "小组加分：" + d.reason));
        UI.toast("小组「" + d.g + "」已加" + d.delta + "分");
        closePts(); renderComment(b);
      });
    };
    el("cmnUndo").onclick = () => {
      if (CMN.last) {
        const s = cls.students.find(x => x.id === CMN.last.sid);
        if (s) {
          s.points = (s.points || 0) - CMN.last.delta;
          (s.pointLog || (s.pointLog = [])).pop();
          Store.save();
          UI.toast("已撤销");
          closePts(); renderComment(b);
        }
      } else UI.toast("没有可撤销的");
    };
    b.querySelectorAll(".cm-card:not(.gray)").forEach(card => card.onclick = () => {
      const sid = card.dataset.sid;
      const s = cls.students.find(x => x.id === sid);
      const lbox = document.createElement("div");
      lbox.className = "cm-lbox";
      lbox.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:500";
      lbox.innerHTML = `<div style="font-size:40px;font-weight:800">${UI.nameOf(s)}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:700px">` +
        labels.map(l => `<button class="cm-label ${l.score < 0 ? "minus" : ""}" data-l="${l.text}" data-s="${l.score}">${l.text} ${l.score > 0 ? "+" : ""}${l.score}</button>`).join("") +
        `</div><button class="cm-btn ghost" id="lboxClose">取消</button>`;
      document.body.appendChild(lbox);
      lbox.querySelectorAll("[data-l]").forEach(btn => btn.onclick = () => {
        const delta = Number(btn.dataset.s);
        CMN.last = { sid, delta };
        addPoints(s, delta, "课堂点评：" + btn.dataset.l);
        lbox.remove();
        closePts(); renderComment(b);
      });
      el("lboxClose").onclick = () => lbox.remove();
    });
    // 记录清理
    window._cmPts = ptsBox;
  }

  /* ---------- 6 举手表决 ---------- */
  const VOTE = { a: 0, b: 0, c: 0, d: 0 };
  function renderVote(b) {
    b.innerHTML = `
      <div class="cm-hint">按键盘 <b>A/B/C/D</b> 或点选项计票</div>
      <div class="vote-grid" id="voteGrid">
        ${["a","b","c","d"].map(k => `<div class="vote-opt" data-k="${k}">
          <div class="v-bar"><i style="height:0%"></i></div>
          <div class="v-key">${k.toUpperCase()}</div>
          <div class="v-cnt">0</div></div>`).join("")}
      </div>
      <button class="cm-btn ghost" id="voteReset" style="margin-top:30px">清零重投</button>`;
    updateVote();
    el("voteReset").onclick = () => { VOTE.a = VOTE.b = VOTE.c = VOTE.d = 0; updateVote(); };
    window._cmKey = (e) => {
      const k = e.key.toLowerCase();
      if (["a","b","c","d"].includes(k)) { e.preventDefault(); VOTE[k]++; updateVote(); }
      else if (e.key >= "1" && e.key <= "7") switchTool({ 1: "pick", 2: "draw", 3: "group", 4: "timer", 5: "comment", 6: "vote", 7: "seat" }[e.key]);
    };
  }
  function updateVote() {
    const total = VOTE.a + VOTE.b + VOTE.c + VOTE.d;
    const max = Math.max(1, VOTE.a, VOTE.b, VOTE.c, VOTE.d);
    const lead = total ? Object.entries(VOTE).reduce((m, x) => x[1] > VOTE[m] ? x[0] : m, "a") : "";
    document.querySelectorAll(".vote-opt").forEach(o => {
      const k = o.dataset.k;
      const n = VOTE[k];
      const pct = total ? Math.round(n / total * 100) : 0;
      o.querySelector(".v-bar i").style.height = Math.round(n / max * 100) + "%";
      o.querySelector(".v-cnt").textContent = `${n} 票 · ${pct}%`;
      o.classList.toggle("lead", k === lead);
    });
  }

  /* ---------- 7 座位点名 ---------- */
  function renderSeatPick(b) {
    const cls = Store.curClass();
    const seats = cls?.seats?.normal || [];
    if (!cls || !seats.length) { b.innerHTML = `<div class="cm-hint">先在「班级 → 座位表」排好座位</div>`; return; }
    const cols = 8;
    b.innerHTML = `<div class="cm-hint">按座位随机点名，或直接点座位</div>
      <button class="cm-btn" id="seatRnd" style="margin-bottom:24px">🎲 随机点一个座位</button>
      <div class="seat-mode" id="seatMode" style="grid-template-columns:repeat(${cols},1fr)">` +
      seats.map((sid, idx) => {
        const s = cls.students.find(x => x.id === sid);
        const today = Store.today();
        const absent = s && s.att && (s.att[today] === "absent" || s.att[today] === "leave");
        return s ? `<div class="seat ${absent ? "empty" : ""}" data-sid="${s.id}" style="background:${UI.colorOf(cls.students.indexOf(s))}33">${UI.nameOf(s)}${absent ? "（缺）" : ""}</div>`
          : `<div class="seat empty">—</div>`;
      }).join("") + `</div>`;
    el("seatRnd").onclick = () => {
      const filled = seats.map((sid, i) => ({ sid, i })).filter(x => x.sid);
      if (!filled.length) return;
      clearInterval(CM.spin);
      const cells = [...document.querySelectorAll("#seatMode .seat")];
      CM.spin = setInterval(() => {
        cells.forEach(c => c.classList.remove("picked"));
        cells[filled[Math.floor(Math.random() * filled.length)].i].classList.add("picked");
      }, 60);
      setTimeout(() => {
        clearInterval(CM.spin);
        const pick = filled[Math.floor(Math.random() * filled.length)];
        cells.forEach(c => c.classList.remove("picked"));
        cells[pick.i].classList.add("picked");
        cells[pick.i].style.animation = "cmPop .3s";
      }, 1500);
    };
    document.querySelectorAll("#seatMode .seat:not(.empty)").forEach(cell => cell.onclick = () => {
      const s = cls.students.find(x => x.id === cell.dataset.sid);
      const lbox = document.createElement("div");
      lbox.className = "cm-lbox";
      lbox.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500";
      lbox.innerHTML = `<div style="font-size:56px;font-weight:800">${UI.nameOf(s)}</div>
        <div style="display:flex;gap:10px">` +
        Store.state.settings.labels.map(l => `<button class="cm-label ${l.score < 0 ? "minus" : ""}" data-l="${l.text}" data-s="${l.score}">${l.text} ${l.score > 0 ? "+" : ""}${l.score}</button>`).join("") +
        `</div><button class="cm-btn ghost" data-close>取消</button>`;
      document.body.appendChild(lbox);
      lbox.querySelectorAll("[data-l]").forEach(btn => btn.onclick = () => {
        addPoints(s, Number(btn.dataset.s), "座位点名：" + btn.dataset.l);
        lbox.remove();
      });
      lbox.querySelector("[data-close]").onclick = () => lbox.remove();
    });
  }

  return {
    open() {
      openMode();
      document.addEventListener("keydown", keyHandler);
    },
    close() {
      closeMode();
      document.removeEventListener("keydown", keyHandler);
    },
    isOpen: () => open,
  };

  function keyHandler(e) {
    if (!open) return;
    if (e.key === "Escape") { closeMode(); return; }
    if (e.key === "c" || e.key === "C") { return; }
    if (window._cmKey) window._cmKey(e);
  }
})();

// 顶栏按钮
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("btnClassMode").onclick = () => {
    if (ClassMode.isOpen()) ClassMode.close();
    else ClassMode.open();
  };
});

</script>

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("SW 注册失败", e); });
