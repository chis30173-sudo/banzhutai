/* ---- 学生档案 ---- */
function openStudentProfile(sid) {
  const S = Store, cls = S.curClass();
  if (!cls) return;
  const s = cls.students.find(x => x.id === sid);
  if (!s) return;
  const i = cls.students.indexOf(s);
  const color = UI.colorOf(i);
  const att = S.attRate(s);
  const tags = (s.tags || []).map(t => `<span class="tag red">${t}</span>`).join("") || "—";
  const phones = (s.phones || []).map((p, j) => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
    <input class="input small" value="${S.escapeHtml(p.rel || "")}" placeholder="关系" style="max-width:90px" data-phone="${j}" data-f="rel">
    <input class="input" value="${S.escapeHtml(p.phone || "")}" placeholder="电话" data-phone="${j}" data-f="phone">
    <button class="btn sm danger" data-pdel="${j}">删</button></div>`).join("") ||
    `<div class="muted small">还没有家长电话，添加后家长来电能马上查到</div>`;
  const comments = (s.comments || []).slice().reverse().slice(0, 10).map(c =>
    `<div class="comm-item" style="padding:8px 10px;margin-bottom:6px"><div class="small muted">${c.date} · ${c.type || "点评"}</div>${S.escapeHtml(c.text)}</div>`).join("") || `<div class="muted small">暂无记录</div>`;
  const log = (s.pointLog || []).slice().reverse().slice(0, 8).map(p =>
    `<div class="pt-row"><span>${p.date} ${S.escapeHtml(p.reason || "")}</span><b style="color:${p.delta >= 0 ? "#16a34a" : "#dc2626"}">${p.delta >= 0 ? "+" : ""}${p.delta}</b></div>`).join("") || `<div class="small muted">暂无积分记录</div>`;

  UI.openModal(UI.modalShell(`${UI.nameOf(s)} · 个人档案`,
    `<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">
      <div style="width:56px;height:56px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">${s.name[0]}</div>
      <div><div style="font-size:19px;font-weight:700">${s.name} <span class="muted small">学号 ${s.no || "—"} · ${s.gender || ""} · ${s.group || ""}</span></div>
      <div style="margin-top:4px">${tags}</div></div>
      <div style="margin-left:auto;text-align:center"><div style="font-size:24px;font-weight:800;color:#d97706">${s.points ?? 0}</div><div class="small muted">总积分</div></div>
    </div>
    <div class="stat-strip">
      <div class="stat"><div class="num">${att.rate}%</div><div class="lbl">出勤率</div></div>
      <div class="stat"><div class="num">${s.avg || "—"}</div><div class="lbl">平均分</div></div>
      <div class="stat"><div class="num">${(s.badges || []).length}</div><div class="lbl">勋章</div></div>
      <div class="stat"><div class="num">${(s.comments || []).length}</div><div class="lbl">点评数</div></div>
    </div>
    <h4 style="margin:12px 0 6px">家长电话</h4>
    <div id="phoneBox">${phones}</div>
    <button class="btn sm" id="phoneAdd">＋ 添加联系人</button>
    <h4 style="margin:14px 0 6px">近期点评 / 沟通记录</h4>${comments}
    <h4 style="margin:14px 0 6px">积分记录</h4>${log}`,
    `<button class="btn" data-close>关闭</button>
     <button class="btn" id="spComment">＋ 写点评</button>
     <button class="btn" id="spAdd" style="background:#d97706;color:#fff;border:none">＋ 加分</button>
     <button class="btn" id="spSub" style="background:#f0f0f0">－ 扣分</button>`), true);

  const box = document.getElementById("modalBox");
  box.querySelectorAll("[data-phone]").forEach(inp => inp.onchange = () => {
    const p = (s.phones || [])[Number(inp.dataset.phone)];
    if (p) { p[inp.dataset.f] = inp.value; S.save(); }
  });
  box.querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => {
    s.phones.splice(Number(b.dataset.pdel), 1); S.save(); openStudentProfile(sid);
  });
  el("phoneAdd").onclick = () => { (s.phones || (s.phones = [])).push({ rel: "", phone: "" }); S.save(); openStudentProfile(sid); };
  el("spComment").onclick = () => UI.form("写点评", [
    { key: "type", label: "类型", type: "select", options: [{ v: "课堂", t: "课堂表现" }, { v: "沟通", t: "家长沟通" }, { v: "评语", t: "评语" }, { v: "其他", t: "其他" }] },
    { key: "text", label: "内容", type: "textarea", required: true },
  ], d => { (s.comments || (s.comments = [])).push({ id: S.uid("cm"), date: S.today(), ...d }); S.save(); openStudentProfile(sid); });
  el("spAdd").onclick = () => changePoints(s, 1, "手动加分");
  el("spSub").onclick = () => changePoints(s, -1, "手动扣分");
}

function changePoints(s, delta, reason) {
  const S = Store;
  s.points = (s.points || 0) + delta;
  (s.pointLog || (s.pointLog = [])).push({ date: S.today(), delta, reason });
  // 勋章自动获得
  const cls = S.curClass();
  (cls?.badgeDefs || []).forEach(bd => {
    if (s.points >= bd.threshold && !(s.badges || []).includes(bd.name)) {
      (s.badges || (s.badges = [])).push(bd.name);
      UI.toast(`🏅 ${s.name} 获得勋章「${bd.name}」`);
    }
  });
  S.save(); App.updateBadges();
}

/* ---- 座位表 ---- */
function renderSeats(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const seats = cls.seats && cls.seats.normal;
  const cols = 8;
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><span style="font-weight:700">座位表</span>
    <span class="muted small">先点学生名字，再点座位放入；点已占座位可交换/移除</span></div></div>`;
  if (seats && seats.length) {
    html += `<div class="seat-grid" style="grid-template-columns:repeat(${cols},1fr)" id="seatGrid">`;
    seats.forEach((sid, idx) => {
      const s = cls.students.find(x => x.id === sid);
      html += s ? `<div class="seat-cell" data-idx="${idx}" style="background:${UI.colorOf(cls.students.indexOf(s))}22;border-color:${UI.colorOf(cls.students.indexOf(s))}">${UI.nameOf(s)}</div>`
        : `<div class="seat-cell empty" data-idx="${idx}">＋</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty"><div class="big">💺</div>还没排座位。点「排座位」开始</div>`;
  }
  html += `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn sm primary" id="seatArrange">排座位</button>
    <button class="btn sm" id="seatClear">清空</button>
    <button class="btn sm" id="seatPrint">打印</button>
  </div>`;
  body.innerHTML = html;
  el("seatArrange").onclick = () => {
    // 先把学生按名册顺序填入
    const arr = new Array(Math.ceil(cls.students.length / cols) * cols).fill("");
    cls.students.forEach((s, i) => arr[i] = s.id);
    cls.seats = Object.assign(cls.seats || {}, { normal: arr });
    S.save(); renderSeats(body);
  };
  el("seatClear").onclick = () => { cls.seats = Object.assign(cls.seats || {}, { normal: [] }); S.save(); renderSeats(body); };
  el("seatPrint").onclick = () => { document.title = "座位表"; window.print(); };
  // 交互：点空位放入学生，点已占座位可移除/交换
  body.querySelectorAll(".seat-cell").forEach(cell => {
    cell.onclick = () => {
      const idx = Number(cell.dataset.idx);
      if (cell.classList.contains("empty")) {
        const stuList = cls.students.map(s => ({ v: s.id, t: `${UI.nameOf(s)}（${s.no || ""}）` }));
        UI.form("放入学生", [{ key: "sid", label: "学生", type: "select", options: stuList }], d => {
          cls.seats.normal[idx] = d.sid;
          S.save(); renderSeats(body);
        });
      } else {
        const sid = cls.seats.normal[idx];
        const s = cls.students.find(x => x.id === sid);
        if (!s) return;
        const { close } = UI.openModal(UI.modalShell(`座位 ${idx + 1}：${UI.nameOf(s)}`,
          `<div style="display:flex;flex-direction:column;gap:10px">
            <button class="btn" id="seatSwap">⇄ 与另一个座位交换</button>
            <button class="btn danger" id="seatRemove">移除该学生</button>
          </div>`));
        el("seatSwap").onclick = () => {
          close();
          UI.form("交换座位", [{ key: "to", label: "目标座位号", type: "number", required: true, hint: `输入要交换的座位号（1-${cls.seats.normal.length}），不含当前座位` }], d => {
            const toIdx = Number(d.to) - 1;
            if (toIdx >= 0 && toIdx < cls.seats.normal.length && toIdx !== idx) {
              const tmp = cls.seats.normal[toIdx];
              cls.seats.normal[toIdx] = cls.seats.normal[idx];
              cls.seats.normal[idx] = tmp;
              S.save(); renderSeats(body); UI.toast("已交换");
            } else UI.toast("座位号无效", "err");
          }, "交换");
        };
        el("seatRemove").onclick = () => {
          cls.seats.normal[idx] = "";
          close();
          S.save(); renderSeats(body);
        };
      }
    };
  });
}

/* ---- 分组 ---- */
function renderGroups(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const groups = {};
  cls.students.forEach(s => {
    const g = s.group || "未分组";
    (groups[g] || (groups[g] = [])).push(s);
  });
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><button class="btn sm primary" id="gAuto">🎲 随机分组</button>
    <button class="btn sm" id="gSave">存为当前分组</button></div></div>`;
  html += Object.keys(groups).map(g => `<div class="card">
    <div class="card-h">${S.escapeHtml(g)} · ${groups[g].length}人</div>
    <div class="card-b">${groups[g].map(s => `<span class="tag" style="font-size:13px">${UI.nameOf(s)}</span>`).join("")}</div></div>`).join("");
  if (!Object.keys(groups).length) html = `<div class="empty"><div class="big">👥</div>还没有分组</div>` + html;
  body.innerHTML = html;
  el("gAuto").onclick = () => UI.form("随机分组", [
    { key: "mode", label: "方式", type: "select", options: [{ v: "num", t: "按组数" }, { v: "size", t: "按每组人数" }] },
    { key: "value", label: "数值", type: "number", value: 4 },
  ], d => {
    const n = d.mode === "num" ? Number(d.value) : Math.ceil(cls.students.length / Number(d.value));
    const shuffled = cls.students.slice().sort(() => Math.random() - 0.5);
    const groupsArr = Array.from({ length: n }, () => []);
    shuffled.forEach((s, i) => groupsArr[i % n].push(s));
    groupsArr.forEach((g, i) => g.forEach(s => s.group = "第" + (i + 1) + "组"));
    S.save(); renderGroups(body); UI.toast("分组完成");
  });
  el("gSave").onclick = () => { UI.toast("分组已保存在学生名册里"); };
}

/* ---- 积分榜 ---- */
function renderPoints(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const sorted = cls.students.slice().sort((a, b) => (b.points || 0) - (a.points || 0));
  const rankCls = ["p0", "p1", "p2"];
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><button class="btn sm" data-pts="person" style="${CV.ptsView === 'group' ? '' : 'font-weight:700;color:#2563eb'}">个人榜</button>
    <button class="btn sm" data-pts="group" style="${CV.ptsView === 'group' ? 'font-weight:700;color:#2563eb' : ''}">小组榜</button>
    <button class="btn sm" id="ptsPrint">打印贴墙上</button></div></div>`;
  if (CV.ptsView !== "group") {
    html += `<table class="grid pts-table"><thead><tr><th style="width:50px">名次</th><th>姓名</th><th>小组</th><th class="right">积分</th><th class="num-c">勋章</th></tr></thead><tbody>`;
    html += sorted.map((s, i) => `<tr class="${rankCls[i] || ""}">
      <td class="rank">${i + 1}</td><td>${UI.nameOf(s)}</td><td>${s.group || "—"}</td>
      <td class="right"><b>${s.points || 0}</b></td><td class="num-c">${(s.badges || []).map(b => "🏅").join("") || "—"}</td></tr>`).join("");
    html += `</tbody></table>`;
  } else {
    const gsum = {};
    cls.students.forEach(s => {
      const g = s.group || "未分组";
      gsum[g] = (gsum[g] || 0) + (s.points || 0);
    });
    html += Object.entries(gsum).sort((a, b) => b[1] - a[1]).map(([g, p], i) => `
      <div class="plan-row"><div class="seq" style="background:${["#2563eb","#dc2626","#16a34a"][i] || "#6b7280"};color:#fff">${i + 1}</div>
      <div class="info"><b>${g}</b></div><div class="date" style="font-size:16px;font-weight:700">${p} 分</div></div>`).join("");
  }
  body.innerHTML = html;
  body.querySelectorAll("[data-pts]").forEach(b => b.onclick = () => { CV.ptsView = b.dataset.pts; renderPoints(body); });
  el("ptsPrint").onclick = () => { document.title = "积分榜"; window.print(); };
}

/* ---- 勋章与兑换 ---- */
function renderBadges(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  let html = `<div class="toolbar" style="margin-bottom:10px"><div class="tb-group">
    <button class="btn sm primary" id="bdAdd">＋ 勋章定义</button>
    <button class="btn sm primary" id="rwAdd">＋ 奖励项</button></div></div>`;
  html += `<div class="card"><div class="card-h">🏅 勋章规则</div><div class="card-b">`;
  html += (cls.badgeDefs || []).map(bd => `<span class="badge-def">🏅 ${S.escapeHtml(bd.name)}（≥${bd.threshold}分）<button class="btn sm danger" data-bdd="${bd.id}" style="padding:0 6px;font-size:11px">删</button></span>`).join("") || `<div class="muted small">还没有勋章规则</div>`;
  html += `</div></div>`;
  html += `<div class="card"><div class="card-h">🎁 积分兑换</div><div class="card-b reward-list">`;
  html += (cls.rewards || []).map(r => `<div class="reward-item">
    <span style="flex:1"><b>${S.escapeHtml(r.text)}</b> <span class="tag orange">${r.cost} 分</span></span>
    <button class="btn sm" data-rwuse="${r.id}">兑换</button>
    <button class="btn sm danger" data-rwd="${r.id}">删</button></div>`).join("") || `<div class="muted small">还没有奖励项</div>`;
  html += `</div></div>`;
  body.innerHTML = html;
  el("bdAdd").onclick = () => UI.form("勋章定义", [
    { key: "name", label: "勋章名", type: "text", required: true, placeholder: "如：数学小达人" },
    { key: "threshold", label: "积分门槛", type: "number", value: 50 },
  ], d => {
    (cls.badgeDefs || (cls.badgeDefs = [])).push({ id: S.uid("bd"), ...d });
    S.save(); renderBadges(body);
  });
  el("rwAdd").onclick = () => UI.form("奖励项", [
    { key: "text", label: "奖励内容", type: "text", required: true, placeholder: "如：免作业券" },
    { key: "cost", label: "所需积分", type: "number", value: 15 },
  ], d => {
    (cls.rewards || (cls.rewards = [])).push({ id: S.uid("rw"), ...d });
    S.save(); renderBadges(body);
  });
  body.querySelectorAll("[data-bdd]").forEach(b => b.onclick = () => {
    cls.badgeDefs = cls.badgeDefs.filter(x => x.id !== b.dataset.bdd); S.save(); renderBadges(body);
  });
  body.querySelectorAll("[data-rwd]").forEach(b => b.onclick = () => {
    cls.rewards = cls.rewards.filter(x => x.id !== b.dataset.rwd); S.save(); renderBadges(body);
  });
  body.querySelectorAll("[data-rwuse]").forEach(b => b.onclick = () => {
    const r = cls.rewards.find(x => x.id === b.dataset.rwuse);
    const stuList = cls.students.map(s => ({ v: s.id, t: `${UI.nameOf(s)}（${s.points || 0}分）` }));
    UI.form(`兑换「${r.text}」`, [{ key: "sid", label: "学生", type: "select", options: stuList }], d => {
      const s = cls.students.find(x => x.id === d.sid);
      if (!s) return;
      if ((s.points || 0) < r.cost) { UI.toast("积分不够，兑换失败", "err"); return; }
      changePoints(s, -r.cost, "兑换：" + r.text);
      UI.toast(`${UI.nameOf(s)} 兑换了「${r.text}」`);
      renderBadges(body);
    });
  });
}

/* ---- 评价量规 ---- */
function renderRubrics(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  let html = `<div class="toolbar" style="margin-bottom:10px"><button class="btn sm primary" id="rbAdd">＋ 新建量规</button></div>`;
  html += (cls.rubricDefs || []).map(r => `<div class="card">
    <div class="card-h">📐 ${S.escapeHtml(r.name)}
      <span style="margin-left:auto"><button class="btn sm" data-rbe="${r.id}">编辑</button><button class="btn sm danger" data-rbd="${r.id}">删除</button></span></div>
    <div class="card-b">${(r.dims || []).map(d => `<div class="small"><b>${S.escapeHtml(d.name)}：</b>${(d.levels || []).map(l => `<span class="tag">${l}</span>`).join("")}</div>`).join("")}</div></div>`).join("") ||
    `<div class="empty"><div class="big">📐</div>还没有评价量规。PBL、口语这类不打分的项目用这个。</div>`;
  body.innerHTML = html;
  el("rbAdd").onclick = () => rubricModal();
  body.querySelectorAll("[data-rbe]").forEach(b => b.onclick = () => rubricModal(cls.rubricDefs.find(r => r.id === b.dataset.rbe)));
  body.querySelectorAll("[data-rbd]").forEach(b => b.onclick = () => {
    cls.rubricDefs = cls.rubricDefs.filter(r => r.id !== b.dataset.rbd); S.save(); renderRubrics(body);
  });
}
function rubricModal(r) {
  const S = Store, cls = S.curClass();
  UI.form(r ? "编辑量规" : "新建量规", [
    { key: "name", label: "量规名称", type: "text", required: true, value: r?.name || "", placeholder: "如：小组合作评价" },
    { key: "dims", label: "维度（用逗号分隔）", type: "text", value: (r?.dims || []).map(d => d.name).join("，"), required: true },
    { key: "levels", label: "等级（用逗号分隔）", type: "text", value: (r?.dims?.[0]?.levels || ["优秀", "良好", "需改进"]).join("，"), required: true },
  ], d => {
    const dims = d.dims.split(/[，,]/).map(x => ({ name: x.trim(), levels: d.levels.split(/[，,]/).map(y => y.trim()) }));
    if (r) { r.name = d.name; r.dims = dims; }
    else (cls.rubricDefs || (cls.rubricDefs = [])).push({ id: S.uid("rb"), name: d.name, dims });
    S.save(); renderRubrics(el("cvBody"));
  }, "保存", { wide: true });
}

</script>
<script>
/* ============ 页面：考勤 / 作业 / 成绩 ============ */
"use strict";

/* ================= 考勤 ================= */
Pages.attendance = {
  render() {
    const S = Store;
    const sel = el("attDate");
    if (!sel.value) sel.value = S.today();
    bindAtt();
    renderAtt();
  },
};
function bindAtt() {
  el("attDate").onchange = () => renderAtt();
  el("attExport").onclick = exportAtt;
  el("attLeave").onclick = leaveModal;
}
function renderAtt() {
  const S = Store, cls = S.curClass();
  const date = el("attDate").value || S.today();
  const body = el("attBody");
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }

  // 统计
  let present = 0, absent = 0, late = 0, leave = 0;
  cls.students.forEach(s => {
    const v = s.att && s.att[date];
    if (v === "absent") absent++; else if (v === "late") late++; else if (v === "leave") leave++; else present++;
  });
  const total = cls.students.length;
  el("attStats").innerHTML = `
    <div class="stat brand"><div class="num">${total}</div><div class="lbl">应到</div></div>
    <div class="stat ok"><div class="num">${present}</div><div class="lbl">实到</div></div>
    <div class="stat warn"><div class="num">${late}</div><div class="lbl">迟到</div></div>
    <div class="stat"><div class="num">${leave}</div><div class="lbl">请假</div></div>
    <div class="stat danger"><div class="num">${absent}</div><div class="lbl">缺勤</div></div>`;

  // 连续缺勤提醒
  const warn = cls.students.filter(s => ["absent","leave"].filter(o => {
    const d = ["-3","-2","-1"].find(o2 => s.att && (s.att[S.addDays(date, Number(o2))] === "absent" || s.att[S.addDays(date, Number(o2))] === "leave"));
    return d;
  }).length >= 3);

  const attRow = (s, v) => {
    const map = { present: "出勤", absent: "缺勤", late: "迟到", leave: "请假" };
    return `<td><span class="att-state ${v || "present"}" data-sid="${s.id}" title="点击切换状态">${map[v || "present"]}</span></td>`;
  };

  let html = `<div class="att-legend">
    <span><i style="background:var(--ok-bg);border:1px solid #86efac"></i>出勤</span>

    <span><i style="background:var(--warn-bg);border:1px solid #f2dcae"></i>迟到</span>

    <span class="muted">默认全员出勤，只需点没来的那几个</span>
  </div>`;
  if (warn.length) html += `<div class="alert warn" style="margin-bottom:10px"><span class="a-ico">⚠️</span><span>连续缺勤建议联系家长：${warn.map(s => UI.nameOf(s)).join("、")}</span></div>`;
  html += `<div style="max-height:60vh;overflow:auto"><table class="att-grid"><thead><tr>
    <th style="width:44px">#</th><th style="text-align:left">姓名</th><th>状态</th><th>出勤率</th></tr></thead><tbody>`;

    const v = s.att && s.att[date];
    const rate = S.attRate(s).rate;
    html += `<tr><td>${s.no || i + 1}</td><td class="nm-cell">${UI.nameOf(s)}</td>${attRow(s, v)}

  });

    const cur = s.att && s.att[date] || "present";
    const next = order[(order.indexOf(cur) + 1) % order.length];
    (s.att || (s.att = {}))[date] = next;
    S.save(); renderAtt();
  });

function leaveModal() {
  const S = Store, cls = S.curClass();
  if (!cls) return;
  const stuList = cls.students.map(s => ({ v: s.id, t: UI.nameOf(s) }));
  UI.form("请假登记", [
    { key: "sid", label: "学生", type: "select", options: stuList },
    { key: "from", label: "开始日期", type: "date", value: S.today() },
    { key: "to", label: "结束日期", type: "date", value: S.today() },
  ], d => {
    let date = d.from;
    let n = 0;
    while (date <= d.to && n < 90) {
      const s = cls.students.find(x => x.id === d.sid);
      if (s) (s.att || (s.att = {}))[date] = "leave";
      date = S.addDays(date, 1); n++;
    }
    S.save(); renderAtt(); UI.toast("请假已登记，那几天考勤自动填好");
  });
}
function exportAtt() {

function exList() {
  const S = Store, cls = S.curClass();
  return S.state.exams.filter(e => !cls || e.clsId === cls.id);
}
function renderEX() {
  const S = Store, cls = S.curClass();
  const body = el("exBody");
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const list = exList();
  const sel = el("exSelect");
  sel.innerHTML = list.map(e => `<option value="${e.id}">${e.name}（${e.date}）</option>`).join("");
  if (list.length && !list.find(e => e.id === sel.value)) sel.value = list[list.length - 1].id;
  if (!list.length) {
    body.innerHTML = `<div class="empty"><div class="big">📊</div>还没有考试。点「＋ 新建考试」开始</div>`;
    return;
  }
  const ex = list.find(e => e.id === sel.value) || list[0];
  sel.value = ex.id;

  // 对比班
  const cmpSel = el("exCompare");
  cmpSel.innerHTML = `<option value="">对比班…</option>` + S.state.classes.filter(c => c.id !== cls.id)
    .map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  const cmpCls = S.state.classes.find(c => c.id === cmpSel.value);

  renderExStats(body, ex, cls, cmpCls);
}

function scoresOf(ex, cls) {
  return cls.students.map(s => ({ s, v: ex.scores?.[s.id]?.total }));
}
function renderExStats(body, ex, cls, cmpCls) {
  const S = Store;
  const scores = scoresOf(ex, cls).filter(x => x.v !== undefined && x.v !== null && x.v !== "");
  const vals = scores.map(x => Number(x.v));
  const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  const pass = vals.filter(v => v >= ex.full * 0.6).length;
  const good = vals.filter(v => v >= ex.full * 0.85).length;
  const passRate = vals.length ? Math.round(pass / vals.length * 100) : 0;
  const goodRate = vals.length ? Math.round(good / vals.length * 100) : 0;
  const max = vals.length ? Math.max(...vals) : 0;
  const min = vals.length ? Math.min(...vals) : 0;

  // 上一次考试（进步退步）
  const prevEx = exList().filter(e => e.id !== ex.id).sort((a, b) => b.date < a.date ? -1 : 1)[0];

  let html = `<div class="stat-strip">
    <div class="stat brand"><div class="num">${avg.toFixed(1)}</div><div class="lbl">平均分</div></div>
    <div class="stat ok"><div class="num">${passRate}%</div><div class="lbl">及格率</div></div>
    <div class="stat"><div class="num">${goodRate}%</div><div class="lbl">优秀率</div></div>
    <div class="stat"><div class="num">${max}</div><div class="lbl">最高</div></div>
    <div class="stat"><div class="num">${min}</div><div class="lbl">最低</div></div></div>`;

  if (cmpCls) {
    const cmpAvg = (() => {
      const cex = S.state.exams.find(e => e.clsId === cmpCls.id && e.name === ex.name);
      if (!cex) return null;
      const cv = cmpCls.students.map(s => cex.scores?.[s.id]?.total).filter(x => x !== undefined);
      return cv.length ? (cv.reduce((a, b) => a + Number(b), 0) / cv.length).toFixed(1) : null;
    })();
    if (cmpAvg !== null) html += `<div class="alert info" style="margin-bottom:10px"><span class="a-ico">⇄</span><span>对比「${cmpCls.name}」平均分 ${cmpAvg}（本班 ${avg.toFixed(1)}）</span></div>`;
  }

  // 知识点
  const kns = ex.knowledges || [];
  if (kns.length) {
    const knRates = kns.map(k => {
      let sum = 0, n = 0;
      cls.students.forEach(s => {
        const kv = ex.scores?.[s.id]?.kd?.[k.name];
        if (kv !== undefined && k.full) { sum += Number(kv); n++; }
      });
      return { name: k.name, rate: n ? Math.round(sum / (n * k.full) * 100) : null };
    }).filter(x => x.rate !== null).sort((a, b) => a.rate - b.rate);
    if (knRates.length) {
      html += `<div class="card"><div class="card-h">📌 知识点掌握情况（红=薄弱，讲评先讲）</div><div class="card-b">`;
      knRates.forEach(k => {
        const cls2 = k.rate < 60 ? "kn-red" : k.rate < 80 ? "kn-yellow" : "kn-green";
        html += `<span class="kn-tag ${cls2}">${S.escapeHtml(k.name)} ${k.rate}%</span>`;
      });
      html += `</div></div>`;
    }
  }

  // 进步退步榜
  if (prevEx) {
    const diffs = scores.map(({ s, v }) => {
      const pv = prevEx.scores?.[s.id]?.total;
      return pv === undefined ? null : { s, diff: Number(v) - Number(pv) };
    }).filter(Boolean).sort((a, b) => b.diff - a.diff);
    if (diffs.length >= 2) {
      html += `<div class="card"><div class="card-h">📈 与上次（${prevEx.name}）相比</div><div class="card-b">
        <div class="small"><b>进步榜：</b>${diffs.slice(0, 3).map(d => `${UI.nameOf(d.s)} +${d.diff}`).join("　")}</div>
        <div class="small" style="margin-top:6px"><b>退步榜：</b>${diffs.slice(-3).reverse().map(d => `${UI.nameOf(d.s)} ${d.diff}`).join("　")}</div></div></div>`;
    }
  }

  // 录入表
  html += `<div style="overflow:auto;max-height:56vh"><table class="grid ex-grid"><thead><tr>
    <th class="hw-sticky">学生</th><th class="num-c">${ex.name}</th><th class="num-c">排名</th></tr></thead><tbody>`;
  const sorted = scores.slice().sort((a, b) => (b.v ?? -1) - (a.v ?? -1));
  cls.students.forEach(s => {
    const v = ex.scores?.[s.id]?.total;
    const rank = sorted.findIndex(x => x.s.id === s.id) + 1;
    const low = v !== undefined && v < ex.full * 0.6;
    const high = v !== undefined && v >= ex.full * 0.85;
    html += `<tr><td class="hw-sticky">${UI.nameOf(s)}</td>
      <td class="num-c"><input class="score-input ${low ? "score-low" : high ? "score-high" : ""}" data-sid="${s.id}" value="${v ?? ""}" placeholder="—"></td>
      <td class="num-c">${v === undefined ? "" : rank}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<div class="small muted" style="margin-top:8px">从 Excel 复制一列成绩，点第一个格子粘贴会自动往下填；回车跳到下一行</div>`;
  body.innerHTML = html;

  // 录入交互
  body.querySelectorAll(".score-input").forEach(inp => {
    inp.onchange = () => {
      const v = inp.value.trim();
      (ex.scores || (ex.scores = {}))[inp.dataset.sid] = { total: v === "" ? null : Number(v) };
      S.save(); renderEX();
    };
    inp.onkeydown = (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const cells = [...body.querySelectorAll(".score-input")];
        const i = cells.indexOf(inp);
        if (i < cells.length - 1) cells[i + 1].focus();
      }
    };
    inp.onpaste = (e) => {
      e.preventDefault();
      const txt = (e.clipboardData.getData("text") || "").trim();
      const nums = txt.split(/\s+/).map(x => Number(x));
      if (!nums.some(x => !isNaN(x))) return;
      const cells = [...body.querySelectorAll(".score-input")];
      const i = cells.indexOf(inp);
      nums.forEach((n, j) => {
        const cell = cells[i + j];
        if (cell) {
          (ex.scores || (ex.scores = {}))[cell.dataset.sid] = { total: isNaN(n) ? null : n };
          cell.value = isNaN(n) ? "" : n;
        }
      });
      S.save(); UI.toast(`已录入 ${nums.filter(x => !isNaN(x)).length} 个成绩`); renderEX();
    };
  });
}
function exAddModal() {
  const S = Store;
  UI.form("新建考试", [
    { key: "name", label: "考试名称", type: "text", required: true, placeholder: "如：期中测试" },
    { key: "date", label: "日期", type: "date", value: S.today() },
    { key: "full", label: "满分", type: "number", value: 100 },
    { key: "weight", label: "权重(%)", type: "number", value: 30 },
    { key: "knowledges", label: "知识点（逗号分隔）", type: "text", hint: "可选。填了之后自动算各知识点掌握率，讲评课照着讲。如：20以内加减法，认识图形" },
  ], d => {
    const ex = {
      id: S.uid("ex"), clsId: S.curClass()?.id, name: d.name, date: d.date, full: d.full || 100, weight: d.weight || 0,
      knowledges: (d.knowledges || "").split(/[，,]/).map(x => x.trim()).filter(Boolean).map(x => ({ name: x, full: Math.round(d.full / 4) })),
      scores: {},
    };
    S.state.exams.push(ex);
    S.save();
    const sel = el("exSelect");
    sel.value = ex.id;
    renderEX();
    UI.toast("考试已创建，开始录入成绩");
  });
}
function importScores() {
  const S = Store, cls = S.curClass();
  const ex = exList().find(e => e.id === el("exSelect").value);
  if (!ex) { UI.toast("先建考试", "err"); return; }
  UI.form("粘贴成绩", [
    { key: "text", label: "成绩", type: "textarea", required: true, hint: "从 Excel 复制一列成绩直接粘贴，按名册顺序对应。" },
  ], d => {
    const nums = d.text.split(/[\s,，\n]+/).filter(Boolean).map(Number);
    cls.students.forEach((s, i) => {
      const n = nums[i];
      if (n !== undefined && !isNaN(n)) (ex.scores || (ex.scores = {}))[s.id] = { total: n };
    });
    S.save(); renderEX(); UI.toast(`已录入 ${nums.filter(x => !isNaN(x)).length} 个成绩`);
  }, "导入", { wide: true });
}
function exportScores() {
  const S = Store, cls = S.curClass();
  const ex = exList().find(e => e.id === el("exSelect").value);
  const rows = [["学号", "姓名", ex ? ex.name + "成绩" : "成绩"]];
  cls.students.forEach(s => rows.push([s.no || "", s.name, ex?.scores?.[s.id]?.total ?? ""]));
  UI.exportCSV(`${cls.name}${ex ? ex.name : "成绩"}.csv`, rows);
}

</script>
<script>
/* ============ 页面：家校 ============ */
"use strict";
const HV = { view: "contacts" };
Pages.home = {
  render() {
    bindHV();
    renderHV();

};
function bindHV() {

function renderHV() {

/* ---- 家长通讯录 ---- */
function renderContacts(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const kw = "";

    <th>学生</th><th>关系</th><th>联系电话</th></tr></thead><tbody>`;
  cls.students.forEach(s => {

    if (!phones.length) {

/* ---- 沟通记录 ---- */
function renderComm(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const list = S.state.communications.filter(c => c.clsId === cls.id);
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><span style="font-weight:700">沟通记录</span>
    <button class="btn sm primary" id="cmAdd">＋ 记一条</button></div></div>`;

    return `<div class="comm-item">
      <div style="display:flex;align-items:center;gap:8px"><b>${UI.nameOf(s)}</b><span class="tag">${c.method || "电话"}</span>

      <div class="small" style="margin-top:4px">${S.escapeHtml(c.content || "")}</div>
      <div class="small muted" style="margin-top:2px">结论：${S.escapeHtml(c.conclusion || "—")}${c.follow ? " · 后续：" + S.escapeHtml(c.follow) : ""}</div>
    </div>`;
  }).join("") || `<div class="empty"><div class="big">📞</div>还没有沟通记录。电话/家访随手记一条，学期末不用回忆。</div>`;
  html += `</div>`;

  el("cmAdd").onclick = () => UI.form("记一条沟通", [

    { key: "date", label: "日期", type: "date", value: S.today() },
    { key: "method", label: "方式", type: "select", options: ["电话", "微信", "面谈", "家访"].map(x => ({ v: x, t: x })) },
    { key: "content", label: "聊了什么", type: "textarea" },
    { key: "conclusion", label: "结论", type: "text" },
    { key: "follow", label: "后续跟进", type: "text" },
  ], d => {
    S.state.communications.push({ id: S.uid("com"), clsId: cls.id, ...d });
    const s = cls.students.find(x => x.id === d.sid);
    (s.comments || (s.comments = [])).push({ id: S.uid("c"), date: d.date, type: "沟通", text: "[" + d.method + "] " + d.content });
    S.save(); renderComm(body);

  body.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => {

    S.save(); renderComm(body);

/* ---- 通知生成 ---- */
function renderNotify(body) {
  const S = Store, cls = S.curClass();
  if (!cls) { body.innerHTML = `<div class="empty">先创建班级</div>`; return; }
  const tpls = S.state.notifyTemplates;
  const checked = {};
  let html = `<div class="toolbar" style="margin-bottom:10px">
    <div class="tb-group"><span style="font-weight:700">通知生成</span></div></div>`;
  html += `<div class="card"><div class="card-h">1. 选模板</div><div class="card-b">`;
  html += tpls.map(t => `<div class="plan-row" style="cursor:pointer" data-tpl="${t.id}">
    <span style="font-weight:600">${S.escapeHtml(t.name)}</span><span class="muted small" style="margin-left:10px">${S.escapeHtml(t.text.slice(0, 40))}…</span></div>`).join("") ||
    `<div class="muted small">还没有模板</div>`;
  html += `<button class="btn sm" id="ntAdd" style="margin-top:6px">＋ 新建模板</button></div></div>`;
  html += `<div class="card"><div class="card-h">2. 勾选学生</div><div class="card-b">
    <button class="btn sm" id="ntAll">全选</button>
    <button class="btn sm" id="ntNone">全不选</button>
    <button class="btn sm" id="ntAbsent">选出没交作业的</button>
    <div style="margin-top:8px;max-height:200px;overflow:auto">` +
    cls.students.map(s => `<label style="display:inline-block;width:120px;margin:3px 6px 3px 0;font-size:13.5px"><input type="checkbox" data-ck="${s.id}"> ${UI.nameOf(s)}</label>`).join("") +
    `</div></div></div>`;
  html += `<div class="card"><div class="card-h">3. 生成结果</div><div class="card-b">
    <div class="notify-box" id="ntResult">选好模板和学生后，点下面生成</div>
    <button class="btn primary" id="ntGen" style="margin-top:10px">⚡ 生成通知</button>
    <button class="btn" id="ntCopy" style="margin-top:10px">📋 全部复制</button></div></div>`;
  body.innerHTML = html;
  let curTpl = null;

  el("ntAdd").onclick = () => UI.form("新建通知模板", [
    { key: "name", label: "模板名", type: "text", required: true, placeholder: "如：作业未交提醒" },
    { key: "text", label: "模板内容", type: "textarea", required: true, hint: "可用占位符：{cls}班级 {names}名单 {homework}作业 {date}日期 {time}时间 {event}事件 {weather}天气" },
  ], d => { S.state.notifyTemplates.push({ id: S.uid("nt"), ...d }); S.save(); renderNotify(body); }, "保存", { wide: true });

  body.querySelectorAll("[data-tpl]").forEach(r => r.onclick = () => {
    body.querySelectorAll("[data-tpl]").forEach(x => x.style.borderColor = "");
    r.style.borderColor = "#2563eb";
    curTpl = tpls.find(t => t.id === r.dataset.tpl);

  el("ntAll").onclick = () => body.querySelectorAll("[data-ck]").forEach(c => c.checked = true);
  el("ntNone").onclick = () => body.querySelectorAll("[data-ck]").forEach(c => c.checked = false);
  el("ntAbsent").onclick = () => {
    const hw = S.state.homeworks.filter(h => h.clsId === cls.id).pop();
    if (!hw) { UI.toast("还没有作业", "err"); return; }
    const st = S.state.homeworkState[hw.id] || {};
    body.querySelectorAll("[data-ck]").forEach(c => c.checked = (st[c.dataset.ck] || "") === "U");

  el("ntGen").onclick = () => {
    if (!curTpl) { UI.toast("先选模板", "err"); return; }

    if (!sids.length) { UI.toast("先勾选学生", "err"); return; }
    const names = sids.map(id => cls.students.find(s => s.id === id)?.name).join("、");
    const text = curTpl.text.replace(/{cls}/g, cls.name).replace(/{names}/g, names).replace(/{date}/g, S.today()).replace(/{homework}/g, "作业").replace(/{time}/g, "").replace(/{event}/g, "").replace(/{weather}/g, "");
    el("ntResult").textContent = text;

  el("ntCopy").onclick = () => {
    const t = el("ntResult").textContent;
